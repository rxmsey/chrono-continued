name: Import upstream Chrono

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import clean upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/IdylRS/chrono-plugin.git /tmp/chrono-upstream
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/chrono-upstream/ ./
          rm -rf bin out
          rm -f .github/workflows/import-upstream.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import clean upstream Chrono source'
          git push origin HEAD:main
